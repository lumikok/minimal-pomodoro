name: Windows release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> ../.cache/target'
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --cache .cache/npm
      - name: Test time display
        run: node --experimental-strip-types --test tests/format.test.mjs
      - name: Test Rust timer and storage
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/target
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/target
        run: npm run tauri -- build --bundles nsis
      - name: Collect installer and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          $name = "minimal-pomodoro_${version}_windows-x64_setup.exe"
          Copy-Item -LiteralPath ".cache/target/release/bundle/nsis/极简番茄钟_${version}_x64-setup.exe" -Destination "release/$name"
          Copy-Item -LiteralPath '.cache/target/release/minimal-pomodoro.exe' -Destination release
          $hash = (Get-FileHash -Algorithm SHA256 "release/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Build isolated desktop acceptance app
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/target
        run: |
          npm run tauri -- build --no-bundle --features acceptance --config tests/acceptance-config.json
          Copy-Item -LiteralPath '.cache/target/release/minimal-pomodoro.exe' -Destination release/pomodoro-acceptance.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7
